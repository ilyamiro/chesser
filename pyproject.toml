[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chesser"
version = "0.1.0"
description = "Turn images into grids of legal chess positions, optionally taken from real Lichess games."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "chess", "cairosvg"]

[project.scripts]
chesser = "chesser.__main__:main"

[tool.setuptools]
packages = ["chesser"]

[tool.setuptools.package-data]
chesser = ["match.c", "pieces/cburnett/*.svg"]
